<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escolha o seu próximo imóvel</title>
<meta name="description" content="Lançamentos, obras e prontos em São Paulo, com fotos, planta, prazo e forma de pagamento. Vitrine preparada pelo seu corretor da Fortal.">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0C09" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Escolha o seu próximo imóvel">
<meta property="og:description" content="Lançamentos, obras e prontos que eu acompanho, com fotos, planta, prazo e forma de pagamento.">
<meta property="og:image" content="https://luizmiguel08.github.io/espelhos/og-selecao.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="preload" href="fonts/mona-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Mona Sans';src:url(fonts/mona-sans.woff2) format('woff2-variations'),url(fonts/mona-sans.woff2) format('woff2');font-weight:200 900;font-stretch:75% 125%;font-style:normal;font-display:swap}
/* tokens do app dos Espelhos (tema claro como padrão; escuro pelo sistema) */
:root{color-scheme:light;--papel:#F6F3EC;--cartao:#FFFCF6;--areia:#EFEAE0;--fio:#E2DBCC;--tinta:#1C1913;--apoio:#675F51;--ouro:#C8A24A;--ouro-t:#7E611A;--verde:#2F7536;--sobre-ouro:#1C1913;--sombra:0 12px 30px rgba(28,25,19,.12);--bg:var(--papel);--ink:var(--tinta);--ink-2:var(--apoio);--muted:var(--apoio);--surface:var(--cartao);--surface-2:var(--areia);--line:var(--fio);--accent:var(--ouro);--accent-ink:var(--sobre-ouro);--f:'Mona Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--curva:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--papel:#0E0C09;--cartao:#18150F;--areia:#221E17;--fio:#2F2A21;--tinta:#F3EEE4;--apoio:#A89F8E;--ouro:#C8A24A;--ouro-t:#D7B663;--verde:#7BC47F;--sombra:0 12px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 16px/1.5 var(--f)}
body.sem-rolagem{overflow:hidden}
h1,h2,h3{margin:0;font-weight:640;font-stretch:112%;letter-spacing:-.01em;line-height:1.12}
p{margin:0}
img{display:block;max-width:100%}
figure{margin:0}
button,a,input{font:inherit;color:inherit}
a{color:var(--ouro-t)}
:focus-visible{outline:2px solid var(--ouro-t);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.miolo{max-width:1120px;margin:0 auto;padding:0 16px}
@media (min-width:900px){.miolo{padding:0 32px}}

/* carregando, erro e prévia */
.load{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--apoio)}
.erro-pg{min-height:100vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;padding:24px;max-width:520px;margin:0 auto}
.erro-pg h1{font-size:28px}
.erro-pg p{color:var(--apoio)}
.previa{position:sticky;top:0;z-index:70;background:var(--tinta);color:var(--papel);text-align:center;font-size:14px;padding:8px 12px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--fio);background:var(--cartao);color:var(--tinta);font-weight:560;text-decoration:none;cursor:pointer;transition:background-color .15s var(--curva),transform .15s var(--curva)}
.btn:active{transform:scale(.98)}
.btn.ouro{background:var(--ouro);border-color:var(--ouro);color:var(--sobre-ouro)}
.btn svg{width:18px;height:18px;flex:none}
.btn.feito{background:var(--areia);border-color:var(--areia);color:var(--apoio)}
.btn.feito::after{content:"Enviado";font-size:12px;font-weight:500;margin-left:2px}
.btn.mini{min-height:40px;padding:8px 12px;font-size:14px;border-radius:10px}

/* o corretor (na capa e no recado) */
.cor{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tinta);min-height:44px}
.cor-ini{width:36px;height:36px;flex:none;border-radius:50%;background:var(--areia);display:flex;align-items:center;justify-content:center;font-weight:640;font-size:14px;color:var(--ouro-t)}
.cor-txt{display:flex;flex-direction:column;line-height:1.2;font-size:14px}
.cor-txt small{color:var(--apoio);font-size:12px}

/* capa: os destaques passando em tela cheia */
.capa{--lado:16px;position:relative;height:72vh;height:72svh;min-height:500px;max-height:700px;background:#14110D;color:#F6F1E7;overflow:hidden}
@media (min-width:900px){.capa{--lado:max(32px,calc((100vw - 1120px) / 2 + 32px));height:min(78vh,720px);min-height:540px}}
.capa-trilho{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.capa-trilho::-webkit-scrollbar{display:none}
.cs{position:relative;flex:0 0 100%;height:100%;margin:0;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.cs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cs::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,12,9,.6) 0,rgba(14,12,9,0) 22%,rgba(14,12,9,0) 38%,rgba(14,12,9,.74) 66%,rgba(14,12,9,.93) 100%)}
.cs-txt{position:absolute;z-index:1;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:0 var(--lado) 24px}
.cs-etq{margin-bottom:6px;padding:5px 11px;border-radius:999px;background:rgba(246,243,236,.17);font-size:13px;font-weight:560;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cs h2{max-width:15ch;font-size:38px;font-weight:680;font-stretch:118%;line-height:1;letter-spacing:-.02em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs-local{margin-top:6px;font-size:16px;font-weight:540}
.cs-sub{font-size:15px;color:rgba(246,241,231,.84)}
.cs-pe{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;width:100%;margin-top:14px}
.cs-preco{font-size:13px;color:rgba(246,241,231,.84);line-height:1.2}
.cs-preco b{display:block;margin-top:2px;font-size:24px;font-weight:660;font-stretch:108%;color:#F6F1E7}
.cs .btn.ouro{flex:none;min-height:48px;padding:12px 20px;border-radius:14px}
.capa-barras{position:absolute;z-index:2;top:max(10px,env(safe-area-inset-top));left:var(--lado);right:var(--lado);display:flex;gap:4px;pointer-events:none}
.capa-barras i{flex:1;height:3px;border-radius:2px;background:rgba(246,243,236,.3);transition:background-color .3s var(--curva)}
.capa-barras i.on,.capa-barras i.ja{background:#F6F3EC}
.capa-topo{position:absolute;z-index:2;left:var(--lado);right:var(--lado);top:calc(max(10px,env(safe-area-inset-top)) + 14px);display:flex;align-items:center;justify-content:space-between;gap:12px}
.selo-logo{height:52px;width:auto;padding:5px;border-radius:14px;background:rgba(246,243,236,.95);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.capa .cor{padding:4px 14px 4px 4px;border-radius:999px;background:rgba(14,12,9,.5);color:#F6F1E7;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.capa .cor-ini{background:#F6F3EC;color:#7E611A}
.capa .cor-txt small{color:rgba(246,241,231,.8)}
.capa-setas{display:none}
@media (min-width:900px){
  .capa-setas{position:absolute;z-index:2;right:var(--lado);bottom:30px;display:flex;gap:10px}
  .capa-setas button{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(246,243,236,.36);background:rgba(14,12,9,.42);color:#F6F1E7;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background-color .15s var(--curva)}
  .capa-setas button:hover{background:rgba(14,12,9,.7)}
  .capa-setas svg{width:22px;height:22px}
  .cs-txt{padding-bottom:36px}
  .cs h2{font-size:64px;max-width:14ch}
  .cs-local{font-size:18px}
  .cs-sub{font-size:16px}
  .cs-pe{width:auto;justify-content:flex-start;gap:28px;margin-top:18px}
  .cs-preco b{font-size:28px}
}
.capa.sem{height:auto;min-height:0;max-height:none;background:none;color:var(--tinta)}
.capa.sem .capa-topo{position:static;padding:12px 0}
.capa.sem .cor{background:var(--cartao);color:var(--tinta);border:1px solid var(--fio)}
.capa.sem .capa-trilho,.capa.sem .capa-barras,.capa.sem .capa-setas{display:none}

/* abertura: a saudação, o recado do corretor e o perfil */
.abre{max-width:1120px;margin:0 auto;padding:26px 16px 0}
.ola h1{font-size:30px;font-weight:660;font-stretch:114%;letter-spacing:-.015em;text-wrap:balance}
.ola > p{margin-top:10px;color:var(--apoio);max-width:620px}
.recado{display:grid;grid-template-columns:40px 1fr;gap:6px 12px;margin-top:18px;padding:16px;border-radius:16px;background:var(--cartao);border:1px solid var(--fio)}
.recado .cor-ini{grid-row:span 2;width:40px;height:40px}
.recado blockquote{margin:0;font-size:16px;line-height:1.5;white-space:pre-line}
.recado figcaption{font-size:13px;color:var(--apoio)}
.perfil{margin-top:24px}
.perfil h2{font-size:17px;font-weight:600;font-stretch:104%}
.perfil .lnk{margin-top:2px}
@media (min-width:900px){
  .abre{display:grid;grid-template-columns:1.15fr 1fr;gap:56px;align-items:start;padding:44px 32px 0}
  .ola h1{font-size:44px}
  .perfil{margin-top:6px;padding:20px;border-radius:20px;background:var(--cartao);border:1px solid var(--fio)}
}
.modos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.modo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:76px;padding:12px 14px;border-radius:14px;border:1px solid var(--fio);background:var(--cartao);text-align:left;cursor:pointer;transition:border-color .15s var(--curva),background-color .15s var(--curva)}
@media (min-width:900px){.modo{background:var(--papel)}}
.modo b{font-size:18px;font-weight:640;font-stretch:112%}
.modo span{font-size:13px;color:var(--apoio);line-height:1.35}
.modo[aria-pressed="true"]{border-color:var(--ouro);background:var(--ouro);color:var(--sobre-ouro)}
.modo[aria-pressed="true"] span{color:var(--sobre-ouro)}
.nota-modo{margin-top:8px;font-size:13px;color:var(--apoio)}

/* coleções: por onde começar */
.colecoes{padding-top:8px}
.col{margin-top:26px}
.col-cab{display:flex;align-items:center;gap:8px;max-width:1120px;margin:0 auto;padding:0 16px}
.col-cab h3{flex:1;min-width:0;font-size:21px}
.col-cab .lnk{flex:none}
.col-setas{display:none}
.col-trilho{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 16px;padding:6px 16px 4px;scrollbar-width:none;overscroll-behavior-x:contain}
.col-trilho::-webkit-scrollbar{display:none}
.mc{position:relative;flex:0 0 172px;aspect-ratio:3/4;padding:0;border:0;border-radius:16px;overflow:hidden;background:var(--areia);color:#F6F1E7;text-align:left;cursor:pointer;scroll-snap-align:start}
.mc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s var(--curva)}
.mc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,12,9,.32) 0,rgba(14,12,9,0) 22%,rgba(14,12,9,0) 40%,rgba(14,12,9,.88) 100%)}
.mc:hover img{transform:scale(1.04)}
.mc.sem-foto{background:#2B251C}
.mc.sem-foto::after{background:none}
.mc-etq{position:absolute;z-index:1;left:8px;top:8px;max-width:calc(100% - 16px);padding:3px 8px;border-radius:8px;background:rgba(14,12,9,.62);font-size:12px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-txt{position:absolute;z-index:1;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}
.mc-txt b{font-size:16px;font-weight:640;font-stretch:108%;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc-txt span{font-size:13px;line-height:1.3;color:rgba(246,241,231,.86)}
.mc-txt .mc-v{margin-top:4px;font-weight:600;color:#F6F1E7}
@media (min-width:900px){
  .col{margin-top:34px}
  .col-cab{padding:0 32px}
  .col-cab h3{font-size:24px}
  .col-setas{display:flex;gap:8px;order:2}
  .col-cab .lnk{order:1;margin-right:8px}
  .col-seta{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--fio);background:var(--cartao);color:var(--tinta);cursor:pointer}
  .col-seta svg{width:20px;height:20px}
  .col-trilho{gap:16px;padding:8px var(--lado-d) 6px;scroll-padding:0 var(--lado-d)}
  .mc{flex-basis:212px}
}
:root{--lado-d:max(32px,calc((100vw - 1120px) / 2 + 32px))}

/* o que você procura */
.busca{margin-top:22px;padding:18px 16px 6px;border-top:1px solid var(--fio)}
@media (min-width:900px){.busca{padding:22px 32px 6px;max-width:1120px;margin:28px auto 0}}
.busca h2{font-size:22px}
.lf{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--fio)}
.lf:last-of-type{border-bottom:0}
.lf > span{font-size:14px;color:var(--apoio)}
@media (min-width:900px){.lf{grid-template-columns:160px 1fr;align-items:center}}
.opcs{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--fio);background:var(--cartao);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .15s var(--curva),border-color .15s var(--curva)}
.chip small{color:var(--apoio);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ouro);border-color:var(--ouro);color:var(--sobre-ouro)}
.chip[aria-pressed="true"] small{color:var(--sobre-ouro)}
.busca-pe{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 0 6px}
.lnk{border:0;background:none;padding:10px 2px;min-height:44px;color:var(--ouro-t);font-weight:560;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* barra fixa com o resumo da busca */
.fixa{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--papel);border-bottom:1px solid var(--fio);transform:translateY(-100%);opacity:0;pointer-events:none;transition:transform .25s var(--curva),opacity .25s var(--curva)}
.fixa.ver{transform:none;opacity:1;pointer-events:auto}
.fixa .miolo{display:flex;align-items:center;gap:10px;min-height:56px}
.fixa p{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fixa p b{font-weight:600}

/* lista */
.lista-cab{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:18px;padding-bottom:6px}
.lista-cab h2{font-size:22px;flex:1 1 220px}
.q{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--fio);border-radius:12px;background:var(--cartao);flex:1 1 260px;max-width:420px}
.q svg{width:17px;height:17px;color:var(--apoio);flex:none}
.q input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.grade{display:grid;grid-template-columns:1fr;gap:28px 20px;padding-top:12px;padding-bottom:40px}
@media (min-width:680px){.grade{grid-template-columns:1fr 1fr}}
@media (min-width:1040px){.grade{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;display:flex;flex-direction:column;min-width:0}
.card-abre{display:flex;flex-direction:column;text-align:left;border:0;padding:0;background:none;cursor:pointer;color:inherit}
.card-foto{position:relative;display:block;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--areia)}
.card-foto img{width:100%;height:100%;object-fit:cover;transition:transform .45s var(--curva)}
.card-abre:hover .card-foto img{transform:scale(1.03)}
.card-foto .ph,.ph-g{position:absolute;inset:0;background:var(--areia)}
.selo{position:absolute;left:10px;bottom:10px;padding:4px 10px;border-radius:8px;background:rgba(14,12,9,.7);color:#F3EEE4;font-size:12px;font-weight:560}
.selo.pronto{background:#2F7536;color:#F3F7EF}
.card-txt{display:flex;flex-direction:column;gap:3px;padding:12px 2px 0}
.card-nome{font-size:20px;font-weight:640;font-stretch:112%;line-height:1.15}
.card-local{font-size:14px;color:var(--apoio)}
.card-fato{font-size:15px}
.card-fato.curto{font-size:14px;color:var(--apoio);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-preco{margin-top:4px;font-size:16px;font-weight:600}
.card-preco small{font-size:13px;font-weight:400;color:var(--apoio)}
.card-preco.cons{font-weight:500;color:var(--ouro-t)}
.coracao{position:absolute;top:8px;right:8px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,252,246,.92);color:#1C1913;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.coracao svg{width:22px;height:22px}
.coracao[aria-pressed="true"]{color:#B23F2B}
.coracao[aria-pressed="true"] svg{fill:currentColor}
.mais{display:block;margin:0 auto 32px}
.vazio{grid-column:1/-1;max-width:560px;padding:24px 0}
.vazio h3{font-size:22px}
.vazio p{color:var(--apoio);margin:8px 0 16px}
.vazio-bts{display:flex;flex-wrap:wrap;gap:10px}

/* favoritos */
.fav-barra{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:35;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto;padding:8px 8px 8px 16px;border-radius:16px;background:var(--tinta);color:var(--papel);box-shadow:var(--sombra)}
.fav-barra p{font-size:14px}
.fav-barra .btn{min-height:40px}
.wa-fixo{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:34;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:56px;height:56px;border-radius:999px;background:#1fa855;color:#fff;text-decoration:none;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.wa-fixo svg{width:26px;height:26px}
.wa-fixo span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:900px){.wa-fixo{width:auto;height:52px;padding:0 20px;right:24px;bottom:24px}.wa-fixo svg{width:22px;height:22px}.wa-fixo span{position:static;width:auto;height:auto;clip:auto}}
body.com-fav .wa-fixo{display:none}

/* folhas (filtros, bairros, favoritos) */
.folha{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(14,12,9,.5)}
.fv{width:100%;max-width:620px;max-height:88vh;max-height:88svh;display:flex;flex-direction:column;background:var(--cartao);border-radius:20px 20px 0 0;box-shadow:var(--sombra);animation:sobe .3s var(--curva)}
@media (min-width:700px){.folha{align-items:center}.fv{border-radius:20px}}
@keyframes sobe{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.fv-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 8px}
.fv-cab h3{font-size:20px}
.fv-x{width:44px;height:44px;border-radius:50%;border:1px solid var(--fio);background:var(--papel);font-size:22px;line-height:1;cursor:pointer}

  }
  function vista(P, x){
    const f = face(P, x); if(!f) return null;

    const alts = Object.keys(f.vistas).map(Number).filter(a => a <= x.an).sort((a, b) => b - a);

  }
  // imagem da ficha: arquivo da pasta do projeto (id) ou foto com endereço completo (ficha automática)
  const ehUrl = s => /^https?:\/\//i.test(String(s || ''));

  const difArea = (pl, a) => { const r = pl && areaPlanta(pl.p); return !!(r && a != null && isFinite(a) && (a < r[0] - 1 || a > r[1] + 1)); };

  const faixaDe = (P, a) => { const f = (P.faixas || []).find(z => a != null && a <= z[0]); return f ? f[1] : null; };

  // ---------- fluxo da tabela (cada parcela arredondada para R$ 10; o financiamento fecha a conta) ----------
  function fluxo(T, preco){
    if(!T || !preco) return null;
    const r = T.arredonda || 10; let soma = 0; const out = [];
    for(const p of T.partes){

      const num = preco * Math.round(p.pct * 10), den = 1000 * p.q * r;     // inteiros: arredonda metade para cima
      const v = Math.floor((2 * num + den) / (2 * den)) * r;
      soma += v * p.q; out.push(Object.assign({}, p, {v}));
    }
    const f = T.partes.find(p => p.resto);
    if(f) out.push(Object.assign({}, f, {v: preco - soma}));
    return out;
  }
  // linhas prontas para mostrar: {t, v, s}

      if(p.q === 1) return {t: cap(p.lbl), v: BRL(p.v), s: mesAno(p.ini)};
      if(p.lbl === 'anuais'){ const ds = []; for(let i = 0; i < p.q; i++) ds.push(mesAno(somaMeses(p.ini, 12 * i))); return {t: p.q + ' anuais', v: BRL(p.v), s: ds.join(' e ')}; }

    });

  const cap = s => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);

  // ---------- opções de valores de uma unidade: tabela (com fluxo) e preços do espelho ----------
  function precosCampos(P, E){
    if(P.precos && P.precos.length) return P.precos;

    return [{k: 'pp', label: 'Parcelado'}, {k: 'pv', label: 'À vista'}];
  }
  function opcoesPreco(P, E, T, x){
    const out = [];
    const chave = String(x.n).toUpperCase();
    if(T && T.u){
      const t = T.u[chave] != null ? T.u[chave] : T.u[x.n];
      if(t != null){
        if(T.tipo === 'lista'){

          if(Array.isArray(t)) out.push({k: 'tabela', rotulo: T.curto || 'Tabela', total: +t[0], linhas: (T.colunas || []).map((c, i) => ({t: c.t, v: BRLc(t[i + 1]), s: c.s || ''})).filter((l, i) => t[i + 1] != null && +t[i + 1] > 0)});
          else out.push({k: 'tabela', rotulo: T.curto || 'Tabela', total: +t.total, linhas: t.linhas || []});

    }

  }

  // ---------- planta do andar (esquema) com a unidade em destaque e o sol do estudo de insolação ----------
  function svgAndar(P, x, opt){

    }

  // planta real do andar (imagem da incorporadora) com a unidade marcada por cima
  function svgImagemAndar(P, x, opt){

      if(alvo){ const [cx, cy, cw, ch, fy] = rs[0]; cx0 = cx + cw / 2; txt = '<text x="' + cx0 + '" y="' + (cy + ch * (fy != null ? fy : 0.5) + fs * 0.35) + '" text-anchor="middle" class="alvo-t" style="font-size:' + fs + 'px;stroke-width:' + Math.round(fs / 5) + 'px">' + esc(x.n) + '</text>'; }

  // faixa do espelho: a linha do andar com a unidade em destaque e os lados (vistas) marcados

  // ---------- visualizador de imagens (tocar para ampliar) ----------
  let vis = null;
  function visualizador(itens, i, opt){
    opt = opt || {};
    if(!vis){
      vis = document.createElement('div'); vis.className = 'vis'; vis.hidden = true;
      vis.innerHTML = '<div class="vis-top"><span class="vis-t"></span><span class="vis-acoes"></span><button type="button" class="vis-x" aria-label="Fechar">×</button></div>' +
        '<div class="vis-area"><img alt="" referrerpolicy="no-referrer"></div><button type="button" class="vis-ant" aria-label="Anterior">‹</button><button type="button" class="vis-prox" aria-label="Próxima">›</button>';
      document.body.appendChild(vis);
      const area = vis.querySelector('.vis-area');
      vis.querySelector('.vis-x').onclick = () => fechar();
      area.addEventListener('click', e => { if(e.target.tagName === 'IMG') area.classList.toggle('zoom'); else fechar(); });
      document.addEventListener('keydown', e => { if(vis.hidden) return; if(e.key === 'Escape') fechar(); if(e.key === 'ArrowRight') mover(1); if(e.key === 'ArrowLeft') mover(-1); });
      vis.querySelector('.vis-ant').onclick = () => mover(-1);
      vis.querySelector('.vis-prox').onclick = () => mover(1);
      let x0 = null; area.addEventListener('touchstart', e => { x0 = e.touches.length === 1 && !area.classList.contains('zoom') ? e.touches[0].clientX : null; }, {passive: true});
      area.addEventListener('touchend', e => { if(x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if(Math.abs(dx) > 60) mover(dx < 0 ? 1 : -1); x0 = null; });
    }
    function fechar(){ vis.hidden = true; document.body.classList.remove('sem-rolagem'); }
    function mover(d){ if(vis._itens.length < 2) return; vis._i = (vis._i + d + vis._itens.length) % vis._itens.length; mostrar(); }
    function mostrar(){
      const it = vis._itens[vis._i]; const area = vis.querySelector('.vis-area'); area.classList.remove('zoom'); area.scrollTo(0, 0);
      vis.querySelector('img').src = it.src; vis.querySelector('.vis-t').textContent = it.t || '';
      const ac = vis.querySelector('.vis-acoes'); ac.innerHTML = '';
      if(vis._opt.acoes) vis._opt.acoes(it, ac);
      vis.querySelector('.vis-ant').hidden = vis.querySelector('.vis-prox').hidden = vis._itens.length < 2;
      if(vis._opt.aoVer) vis._opt.aoVer(it);
    }
    vis._itens = itens; vis._i = i || 0; vis._opt = opt;
    vis.hidden = false; document.body.classList.add('sem-rolagem'); mostrar();
  }

  // ---------- compartilhar arquivos (WhatsApp etc.) com alternativa de baixar ----------
  // foto de outro site que não deixa baixar (ficha automática): vai o link no lugar do arquivo
  async function arquivos(lista){
    const fs = await Promise.all(lista.map(async it => {
      try{ const r = await fetch(it.src); if(!r.ok) return null; const b = await r.blob(); return new File([b], it.nome || it.src.split('/').pop(), {type: b.type || 'image/jpeg'}); }
      catch(e){ return null; }
    }));
    return fs.filter(Boolean);
  }
  async function compartilhar(lista, texto){
    try{
      const fs = await arquivos(lista);
      if(!fs.length){
        const t = (texto ? texto + '\n' : '') + lista.map(it => it.src).join('\n');
        if(navigator.share){ await navigator.share({text: t}); return 'links'; }
        await navigator.clipboard.writeText(t); return 'copiado';
      }
      if(navigator.canShare && navigator.canShare({files: fs})){ await navigator.share({files: fs, text: texto || undefined}); return 'ok'; }
      for(const f of fs){ const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
      return 'baixado';
    }catch(e){ if(e && e.name === 'AbortError') return 'cancelado'; throw e; }
  }
  function toast(t){
    let el = $('toast'); if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, 3200);
  }
  const quando = iso => {
    if(!iso) return '';
    const d = new Date(iso), s = (Date.now() - d.getTime()) / 1000;
    if(s < 60) return 'agora há pouco';
    if(s < 3600) return 'há ' + Math.floor(s / 60) + ' min';
    if(s < 86400) return 'há ' + Math.floor(s / 3600) + ' h';
    return d.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit', timeZone: 'America/Sao_Paulo'}) + ' às ' + d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo'});
  };
  const soDigitos = s => String(s || '').replace(/\D/g, '');
  const waNum = tel => { let d = soDigitos(tel); if(!d) return ''; if(d.length <= 11) d = '55' + d; return d; };

      const bpl = el('button', 'tp-pl'); bpl.type = 'button';
      if(mp.length){ const im = el('img'); im.alt = 'Planta ' + rotuloTp(t); im.loading = 'lazy'; im.src = mp[0].src; im.addEventListener('error', () => { im.remove(); bpl.appendChild(el('span', 'sem', 'Planta com ' + cor)); }); bpl.appendChild(im); if(mp.length > 1) bpl.appendChild(el('small', null, mp.length + ' plantas')); }
      bpl.addEventListener('click', () => { if(!mp.length) return; evento('plantas', p.id); visualizador(mp.map(x => ({src: x.src, t: x.t})), 0, {acoes: (it, ac) => ac.appendChild(pedido(p, 'planta', it.t, 'Gostei desta planta', 'ouro mini'))}); });
      if(mp.length) cardTp.appendChild(bpl);
      else { const pp = pedido(p, 'plantas', rotuloTp(t) + (t.amin ? ' de ' + faixaM2(t.amin, t.amax) : ''), 'Pedir esta planta'); pp.className = 'tp-pl pedir'; cardTp.appendChild(pp); }
      const tx = el('div', 'tp-txt');
      const nm = el('b', null, t.tl); if(t.cl) nm.appendChild(el('span', 'etq', t.cl)); tx.appendChild(nm);
      tx.appendChild(el('span', 'm2', faixaM2(t.amin, t.amax) || 'Metragem com ' + cor));
      if(S.precos === 'apartir' && t.p != null){ const v = el('span', 'v'); v.appendChild(el('small', null, 'a partir de ')); v.appendChild(document.createTextNode(partir(t.p))); tx.appendChild(v); }
      if(t.n != null && t.n <= 3) tx.appendChild(el('span', 'ult', t.n === 1 ? 'Última unidade desta planta' : 'Últimas ' + t.n + ' unidades desta planta'));
      tx.appendChild(pedido(p, 'tipologia', rotuloTp(t) + (t.amin ? ' de ' + faixaM2(t.amin, t.amax) : ''), 'Quero esta', 'mini'));
      cardTp.appendChild(tx); grade.appendChild(cardTp);
    });
    s1.appendChild(grade);
    if(!ts.length){
      s1.replaceChildren(el('h3', null, 'Disponibilidade'));
      s1.appendChild(el('p', 'sub', 'Hoje a tabela da construtora está sem unidade disponível. Eu vejo com a construtora se volta alguma unidade ou se tem outra opção parecida.'));
      if(pls.length){
        const tr = el('div', 'tps');
        pls.slice(0, 8).forEach((x, k) => { const b = el('button', 'tp tp-pl'); b.type = 'button'; const im = el('img'); im.alt = x.t; im.loading = 'lazy'; im.src = x.src; im.addEventListener('error', () => b.remove()); b.appendChild(im); b.addEventListener('click', () => { evento('plantas', p.id); visualizador(pls.slice(0, 8).map(y => ({src: y.src, t: y.t})), k); }); tr.appendChild(b); });
        s1.appendChild(tr);
      }
      s1.appendChild(pedido(p, 'disponibilidade', '', 'Perguntar se ainda tem unidade', 'ouro'));
    }
    const cls = [...new Set(ts.map(t => t.cl).filter(Boolean))];
    if(cls.length){
      const txt = [];
      if(cls.includes('HIS') || cls.includes('HMP')) txt.push('HIS e HMP têm preço controlado pela Prefeitura: a compra exige comprovar renda familiar dentro do limite.');
      if(cls.includes('NR')) txt.push('NR é unidade não residencial. Se a ideia é alugar por temporada, eu confirmo as regras do condomínio com a construtora.');
      s1.appendChild(el('p', 'cls', txt.join(' ')));
    }
    // para quem investe (só dados da tabela e do espelho)
    const sInv = el('section', 'sec'); sInv.appendChild(el('h3', null, 'Para quem investe'));
    const inv = el('div', 'inv'), iv = (b, s) => { const x = el('div'); x.appendChild(el('b', null, b)); x.appendChild(el('span', null, s)); inv.appendChild(x); };
    const pm2 = S.precos === 'apartir' ? Math.min.apply(null, ts.map(t => t.pm2).filter(x => x)) : null;
    if(pm2 && isFinite(pm2)) iv(reais(pm2) + ' o m²', 'na unidade de entrada');
    const tb = ts.filter(t => t.fl && t.fl.rows).sort((a, b) => (a.p || 0) - (b.p || 0))[0];
    if(tb){ const po = 100 - tb.fl.rows.filter(r => r.t === 'fin' || r.t === 'pos').reduce((s, r) => s + (+r.p || 0), 0); iv(Math.round(po) + '% até as chaves', po >= 99.5 ? 'pago direto à construtora, sem financiamento' : 'o resto no financiamento, na entrega'); }
    const m = p.fase === 'pronto' ? 0 : mesesAte(p.entrega);
    if(p.fase === 'pronto') iv('Pronto', 'sem espera de obra');
    else if(p.entrega) iv(m != null && m > 0 ? m + (m === 1 ? ' mês' : ' meses') : entregaTxt(p), 'até a entrega, em ' + mesAno(p.entrega));
    if(inv.childNodes.length){ sInv.appendChild(inv); }
    // como pagar
    const sPg = el('section', 'sec'); sPg.appendChild(el('h3', null, 'Como pagar'));
    const comFl = ts.filter(t => t.fl);
    if(d){
      if(comFl.length){
        sPg.appendChild(el('p', 'sub', 'Escolha a planta para ver a condição da construtora.'));
        const seg = el('div', 'seg'), box = el('div');
        let sel = comFl.find(t => okDorm(t) && okValor(Object.assign({piso: t.p, teto: t.p}, t))) || comFl.slice().sort((a, b) => (a.p || 0) - (b.p || 0))[0];
        const marca = () => seg.querySelectorAll('.chip').forEach((b, i) => b.setAttribute('aria-pressed', String(comFl[i] === sel)));
        comFl.forEach(t => { const b = el('button', 'chip', rotuloTp(t) + (t.amin ? ', ' + faixaM2(t.amin, t.amax) : '')); b.type = 'button'; b.addEventListener('click', () => { sel = t; marca(); desenharFluxo(box, p, sel); }); seg.appendChild(b); });
        if(comFl.length > 1) sPg.appendChild(seg);
        marca(); desenharFluxo(box, p, sel); sPg.appendChild(box);
        sPg.appendChild(pedido(p, 'condicoes', '', 'Quero simular outra unidade'));
      }else{ sPg.appendChild(el('p', 'sub', 'A construtora ainda não mandou o fluxo de pagamento deste. Eu monto a condição e te passo pelo WhatsApp.')); sPg.appendChild(pedido(p, 'condicoes', '', 'Pedir a condição de pagamento')); }
    }else sPg.appendChild(el('p', 'carregando', 'Carregando a condição de pagamento…'));
    if(!ts.length && (d || p.semDisp)) c.appendChild(s1);
    else if(MODO === 'investir'){ c.appendChild(sInv); c.appendChild(s1); c.appendChild(sPg); }
    else { c.appendChild(s1); c.appendChild(sPg); c.appendChild(sInv); }
    // onde fica
    const end = (d && d.endereco) || '', lat = d && d.lat != null ? +d.lat : null, lng = d && d.lng != null ? +d.lng : null;
    if(end || (lat != null && isFinite(lat))){
      const s = el('section', 'sec'); s.appendChild(el('h3', null, 'Onde fica'));
      s.appendChild(el('p', 'sub', [end.replace(/\s*·\s*/g, ', '), end.indexOf(p.bairro || '§') < 0 ? p.bairro : ''].filter(Boolean).join(', ')));
      const qy = lat != null && isFinite(lat) && lng != null && isFinite(lng) ? lat + ',' + lng : encodeURIComponent(end.replace(/\s*·\s*/g, ', ') + ', ' + (p.cidade || 'São Paulo'));
      const mp = el('div', 'mapa'), fr = document.createElement('iframe'); fr.loading = 'lazy'; fr.title = 'Mapa do ' + p.nome; fr.src = 'https://maps.google.com/maps?q=' + qy + '&z=15&output=embed'; fr.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
      mp.appendChild(fr); s.appendChild(mp);
      const am = el('a', 'lnk', 'Abrir no Google Maps'); am.href = (P && P.mapa) || 'https://www.google.com/maps/search/?api=1&query=' + qy; am.target = '_blank'; am.rel = 'noopener'; am.style.display = 'inline-block';
      am.addEventListener('click', () => evento('mapa', p.id)); s.appendChild(am);
      const perto = ((P && P.perto) || pertoDe(d && d.destaque) || []).slice(0, 8);
      if(perto.length){
        const pt = el('div', 'perto');
        perto.forEach(x => { const r = el('div'); r.appendChild(el('span', null, x.nome));
          r.appendChild(el('b', null, x.m != null ? (x.m >= 1000 ? (x.m / 1000).toLocaleString('pt-BR', {maximumFractionDigits: 1}) + ' km' : x.m + ' m') : [x.pe != null ? x.pe + ' min a pé' : null, x.bike != null ? x.bike + ' min de bicicleta' : null, x.carro != null ? x.carro + ' min de carro' : null, x.min != null ? x.min + ' min' : null].filter(Boolean).join(', ')));
          pt.appendChild(r); });
        s.appendChild(pt);
      }
      c.appendChild(s);
    }
    // lazer
    let lz = [];
    if(P && Array.isArray(P.lazer)) P.lazer.forEach(l => (l.itens || []).forEach(x => { if(lz.length < 18 && !lz.includes(x)) lz.push(x); }));
    if(!lz.length && d && Array.isArray(d.lazer)) lz = d.lazer.filter(x => typeof x === 'string').slice(0, 18);
    if(lz.length){ const s = el('section', 'sec'); s.appendChild(el('h3', null, 'Lazer')); const z = el('div', 'lazer'); lz.forEach(x => z.appendChild(el('span', null, String(x).replace(/\s*\(.*\)\s*$/, '')))); s.appendChild(z); c.appendChild(s); }
    // material da construtora
    const mats = [];
    if(P && P.book) mats.push({t: 'Book do empreendimento', u: 'nex/' + P.pasta + P.book});
    else { const bo = P ? bookOficial(P) : null; if(bo) mats.push({t: 'Book do empreendimento', u: driveUrl(bo.id)}); }
    ((d && d.material) || []).forEach(x => { if(!mats.some(y => y.u === x.u)) mats.push({t: x.t, u: x.u}); });
    ((P && P.tours) || []).filter(z => z && z.u).forEach(z => mats.push({t: z.cli || z.t || 'Tour 360°', u: z.u}));
    if(mats.length){
      const s = el('section', 'sec'); s.appendChild(el('h3', null, 'Material da construtora'));
      const ml = el('div', 'links');
      mats.slice(0, 8).forEach(x => { const a = el('a', 'btn', x.t); a.href = x.u; a.target = '_blank'; a.rel = 'noopener'; a.addEventListener('click', () => evento('material', p.id)); ml.appendChild(a); });
      s.appendChild(ml); c.appendChild(s);
    }
    // visita com o corretor
    const vi = el('div', 'visita');
    const cr = el('div', 'cor'); cr.innerHTML = corretorHtml(); vi.appendChild(cr);
    vi.appendChild(el('p', null, p.fase === 'pronto' ? 'Quer ver pessoalmente? Eu marco a visita e vou com você.' : 'Quer conhecer o decorado e a região? Eu marco a visita e vou com você.'));
    const bts = el('div', 'bts'); bts.appendChild(pedido(p, 'visita', '', 'Agendar uma visita', 'ouro')); vi.appendChild(bts);
    c.appendChild(vi);
    // parecidos
    const par = parecidos(p);
    if(par.length){ const s = el('section', 'sec'); s.appendChild(el('h3', null, p.tps.length ? 'Parecidos com este' : 'Com unidade disponível perto deste')); const pg = el('div', 'parecidos'); par.forEach(x => pg.appendChild(card(x.p, x.ts))); s.appendChild(pg); c.appendChild(s); }
    if(P && P.legal) c.appendChild(el('p', 'legal', P.legal));
    // barra de baixo
    const pe = $('fi-pe'); pe.replaceChildren();
    const cf = coracao(p); pe.appendChild(cf);
    pe.appendChild(pedido(p, 'saber', '', 'Falar com ' + cor + ' sobre este', 'ouro'));
  }
  function pedido(p, mot, tl, rot, cls){
    const cor = primeiro(S.corretor), oi = 'Oi' + (cor ? ', ' + cor : '') + '. ';
    const txt = mot === 'condicoes' ? oi + 'Quero simular a condição de pagamento do ' + p.nome + '.'
      : mot === 'visita' ? oi + 'Quero agendar uma visita ao ' + p.nome + '.'
      : mot === 'tipologia' ? oi + 'Tenho interesse no ' + tl + ' do ' + p.nome + '. Pode me passar os detalhes?'
      : mot === 'planta' ? oi + 'Gostei desta planta do ' + p.nome + (tl ? ' (' + tl + ')' : '') + '. Pode me passar os detalhes?'
      : mot === 'plantas' ? oi + 'Pode me mandar a planta ' + (tl ? 'do ' + tl + ' ' : '') + 'do ' + p.nome + '?'
      : mot === 'fotos' ? oi + 'Pode me mandar fotos do ' + p.nome + '?'
      : mot === 'disponibilidade' ? oi + 'Vi o ' + p.nome + ' na vitrine. Ainda tem unidade disponível?'
      : oi + 'Vi o ' + p.nome + ' na vitrine que você me mandou e quero saber mais.';
    return linkWa(txt, rot, () => evento('interesse', p.id + '|' + mot + (tl ? '|' + tl : '')), cls);
  }
  function parecidos(p){
    if(!p.tps.length) return L.filter(x => x !== p && x.zk === p.zk && x.capa && x.tps.length)
      .sort((a, b) => ((b.bairro === p.bairro) - (a.bairro === p.bairro)) || (a.peso - b.peso) || (a.rec - b.rec)).slice(0, 4).map(x => ({p: x, ts: x.tps}));
    const base = pisoMin(p.tps), ds = new Set(p.tps.map(t => t.d));
    return L.filter(x => x !== p && x.zk === p.zk && x.capa).map(x => {
      const ts = x.tps.filter(t => ds.has(t.d)); if(!ts.length) return null;
      const v = pisoMin(ts); const dif = isFinite(base) && isFinite(v) ? Math.abs(v - base) / base : 1;
      return dif <= 0.35 ? {p: x, ts, dif: dif + (x.bairro === p.bairro ? -0.2 : 0)} : null;
    }).filter(Boolean).sort((a, b) => a.dif - b.dif).slice(0, 4);
  }

  // ---------- eventos da página ----------
  document.addEventListener('click', ev => {
    const t = ev.target;
    if(t.closest('.fv-x') && !t.closest('.fav-item') || t.id === 'folha') fecharFolha();
    else if(t.closest('.fi-voltar')) voltar();
    else if(t.closest('#mais-f')) abrirFolha('mais');
    else if(t.closest('#fav-ver')) abrirFolha('favoritos');
    else if(t.closest('#limpar')) limpar();
  });
  document.addEventListener('keydown', ev => { if(ev.key !== 'Escape') return; if(document.querySelector('.vis:not([hidden])')) return; if(FOLHA) fecharFolha(); else if(FI) voltar(); });

  iniciar();
})();
